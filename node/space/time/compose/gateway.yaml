apiVersion: v1
kind: Service
metadata:
  name: fiber-gateway
  namespace: fiber-topos
spec:
  selector:
    app: fiber-gateway
  ports:
    - port: 8356
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiber-gateway
  namespace: fiber-topos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiber-gateway
  template:
    metadata:
      labels:
        app: fiber-gateway
    spec:
      volumes:
      - name: artifact-volume
        emptyDir: {}
      containers:
      - name: gateway
        image: fiber-node:local
        imagePullPolicy: Never
        command: ["fiber", "daemon", "-s", "rest_edge"]
        env:
        - name: XPHI_ENV
          value: "ci"
        - name: VCR_MODE
          value: "live"
        - name: NODE_PROFILE
          value: "EDGE"
        readinessProbe:
          httpGet:
            path: /_health
            port: 8356
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - name: artifact-volume
          mountPath: /artifact_mount